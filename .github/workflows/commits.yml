name: Commits

on:
  pull_request:

jobs:
  subjects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Every commit in the pull request, not just the tip.
          fetch-depth: 0
      - name: Check commit subjects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          while read -r sha; do
            git log -1 --format=%B "$sha" > /tmp/msg
            if ! .githooks/commit-msg /tmp/msg; then
              echo "  in commit $sha" >&2
              status=1
            fi
          done < <(git rev-list --no-merges "$BASE..$HEAD")
          exit $status
