name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 8 * * *'  # Runs at 8 AM UTC daily
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Upstream
        run: |
          git remote get-url upstream || git remote add upstream https://github.com/jakobdylanc/llmcord.git
          git fetch upstream main

      - name: Check for New Upstream Commits
        id: check
        run: |
          if [ -z "$(git log HEAD..upstream/main --oneline)" ]; then
            echo "Already up to date with upstream."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "New upstream commits:"
            git log HEAD..upstream/main --oneline
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge Upstream into Sync Branch
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git checkout -B sync/upstream
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::Merge conflict with upstream/main. Resolve it locally, then push."
            exit 1
          fi
          git push --force-with-lease origin sync/upstream

      - name: Open Pull Request
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh pr list --head sync/upstream --base main --state open --json number --jq '.[].number')" ]; then
            echo "Pull request already open; the branch push updated it."
            exit 0
          fi
          gh pr create \
            --base main \
            --head sync/upstream \
            --title "chore(sync): merge upstream changes" \
            --body "Automated sync with jakobdylanc/llmcord. Review the diff before merging; local changes are no longer overwritten silently."
