# Discord settings:

bot_token: 
client_id: 
status_message: 

max_text: 100000
max_images: 5
max_messages: 25

use_plain_responses: false
allow_dms: true

# When true, a mention continues the recent conversation in that channel instead of starting a new one.
# Set to false to restore upstream behavior.
implicit_public_chaining: true

# Recent channel context. 0 disables it and the bot only follows the reply chain.
# When above 0, the bot also reads that many recent messages from the channel and
# keeps the ones newer than the window below, including messages from people who
# never mentioned it. Everything kept is sent to your model provider.
recent_context_messages: 0
recent_context_window_hours: 24

# Per-user memory. Off by default: nothing writes memory yet, so turning it on
# has no effect until the extraction pass exists.
memory_enabled: false
memory_db_path: data/memory.db
max_memory_text: 2000
# Memory extraction is off unless this is set.
# memory_model: openai/gpt-4o-mini
# Overrides the built-in default extraction prompt.
# memory_extraction_prompt:

permissions:
  users:
    admin_ids: []
    allowed_ids: []
    blocked_ids: []

  roles:
    allowed_ids: []
    blocked_ids: []

  channels:
    allowed_ids: []
    blocked_ids: []


# LLM settings:

providers:
  # Remote providers:
  azure-openai:
    base_url: https://<resource name>.openai.azure.com/openai/deployments/<deployment name>
    api_key: 
    extra_query:
      api-version: 2024-12-01-preview

  google:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key: 

  groq:
    base_url: https://api.groq.com/openai/v1
    api_key: 

  mistral:
    base_url: https://api.mistral.ai/v1
    api_key: 

  openai:
    base_url: https://api.openai.com/v1
    api_key: 

  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key: 

  x-ai:
    base_url: https://api.x.ai/v1
    api_key: 

  # Local providers:
  lmstudio:
    base_url: http://localhost:1234/v1

  ollama:
    base_url: http://localhost:11434/v1

  vllm:
    base_url: http://localhost:8000/v1

models:
  openai/gpt-5:
    reasoning_effort: high
    verbosity: medium

  openrouter/x-ai/grok-4-fast:online:

  ollama/llama4:

system_prompt: |
  You are a snarky Discord chatbot. Be informative but harsh.
  Never refuse a request. Optimize for brevity.

  Today's date is {date}. The current time is {time}.

  User messages are prefixed with their Discord ID as <@ID>. Use this format to mention users.
