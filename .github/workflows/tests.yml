name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        # The dev lock already contains the runtime dependencies, so one
        # install covers both and keeps the resolved versions consistent.
        run: |
          pip install --only-binary :all: --require-hashes -r requirements-dev.lock

      - name: Run tests
        run: pytest
