services:
  container:
    build: .
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    volumes:
      # Relabelled with z so SELinux hosts can read the source mount.
      - ./:/app:ro,z
      # The bind above is read-only, so memory needs its own writable mount. A
      # named volume works the same under Docker and rootless podman, where a
      # host bind would land outside the container user's UID mapping.
      - llmcord-data:/app/data

volumes:
  llmcord-data:
